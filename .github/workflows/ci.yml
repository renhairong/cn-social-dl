name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell-check:
    name: Shell syntax & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: bash -n syntax check
        run: bash -n dl.sh

      - name: shellcheck (warnings only, non-blocking)
        run: shellcheck -S warning dl.sh || true
